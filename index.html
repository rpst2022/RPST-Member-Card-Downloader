<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RPST Member Access Card Downloader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="container">
    <h1>RPST Member Access Card Downloader</h1>

    <input type="text" id="searchInput" placeholder="Search by Member ID" onkeyup="searchMembers()" />

    <table id="memberTable">
      <thead>
        <tr>
          <th>Member ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>ID Card</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="members.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
